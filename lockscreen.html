<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Session Locked</title>
    <style>
      :root {
        color-scheme: dark light;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: #0f172a;
        color: #f8fafc;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }

      #lockscreen-overlay {
        position: fixed;
        inset: 0;
        background: rgba(15, 23, 42, 0.95);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
      }

      .lockscreen-card {
        width: min(360px, 90%);
        background: rgba(15, 23, 42, 0.85);
        border: 1px solid rgba(148, 163, 184, 0.25);
        box-shadow: 0 25px 60px rgba(15, 23, 42, 0.45);
        border-radius: 16px;
        padding: 32px 28px;
        text-align: center;
        backdrop-filter: blur(12px);
      }

      .lockscreen-card h1 {
        margin: 0 0 16px;
        font-size: 1.5rem;
        font-weight: 600;
        letter-spacing: 0.01em;
      }

      .lockscreen-card p {
        margin: 0 0 24px;
        font-size: 0.95rem;
        color: #cbd5f5;
      }

      form {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      input[type='text'] {
        padding: 12px 14px;
        font-size: 1.1rem;
        border-radius: 12px;
        border: 1px solid rgba(148, 163, 184, 0.4);
        background: rgba(15, 23, 42, 0.7);
        color: #f8fafc;
        text-align: center;
        letter-spacing: 0.3em;
      }

      input[type='text']:focus {
        outline: 2px solid rgba(96, 165, 250, 0.7);
        outline-offset: 2px;
      }

      button[type='submit'] {
        padding: 12px 14px;
        font-size: 1rem;
        border-radius: 12px;
        border: none;
        background: #2563eb;
        color: #f8fafc;
        font-weight: 600;
        letter-spacing: 0.08em;
        cursor: pointer;
      }

      button[type='submit']:hover {
        background: #1d4ed8;
      }

      .error-message {
        color: #f97316;
        min-height: 1.4em;
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <div id="lockscreen-overlay" role="dialog" aria-modal="true" aria-labelledby="lockscreen-title">
      <div class="lockscreen-card">
        <h1 id="lockscreen-title">Session Locked</h1>
        <p>Enter the 6-digit code from your authenticator app to continue.</p>
        <form id="lockscreen-form" autocomplete="off">
          <input
            id="totp-input"
            type="text"
            inputmode="numeric"
            pattern="\d{6}"
            maxlength="6"
            aria-label="One-time passcode"
            required
          />
          <div class="error-message" id="error-message" role="alert" aria-live="assertive"></div>
          <button type="submit">Unlock</button>
        </form>
      </div>
    </div>
    <script type="module" src="lockscreen.js"></script>
  </body>
</html>
